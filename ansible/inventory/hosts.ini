# inventory/hosts.ini
# Homelab LXC inventory — 2-node Proxmox cluster
# Connect via SSH from pve-node1 or any host with SSH access to the LAN

[proxmox]
pve-node1 ansible_host=192.168.0.65 ansible_user=root
pve-node2 ansible_host=192.168.0.17 ansible_user=root

[edge]
ct101 ansible_host=192.168.0.101 ansible_user=root

[media]
ct102 ansible_host=192.168.0.102 ansible_user=root

[monitoring]
ct103 ansible_host=192.168.0.103 ansible_user=root

[automation]
ct104 ansible_host=192.168.0.104 ansible_user=root

[security]
ct105 ansible_host=192.168.0.105 ansible_user=root

[utility]
ct106 ansible_host=192.168.0.106 ansible_user=root

[radio]
ct107 ansible_host=192.168.0.107 ansible_user=root

[lab]
ct108 ansible_host=192.168.0.108 ansible_user=root

[ai]
ct109 ansible_host=192.168.0.109 ansible_user=root  # Claude Code / OpenHands
ct111 ansible_host=192.168.0.111 ansible_user=root  # Hermes Agent
ct112 ansible_host=192.168.0.112 ansible_user=root  # Ollama (node2, GPU)
ct114 ansible_host=192.168.0.114 ansible_user=root  # LibreChat
ct118 ansible_host=192.168.0.118 ansible_user=root  # LiteLLM

[databases]
ct110 ansible_host=192.168.0.110 ansible_user=root  # PostgreSQL 16

[lxc:children]
edge
media
monitoring
automation
security
utility
radio
lab
ai
databases

[homelab:children]
proxmox
lxc