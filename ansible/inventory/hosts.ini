# inventory/hosts.ini
# Homelab LXC inventory — single-node Proxmox cluster (node2 removed 2026-09-04)
# All IPs are DHCP (may change). Verified 2026-09-07.
# Connect via SSH from pve-node1 or any host with SSH access to the LAN

[proxmox]
pve-node1 ansible_host=192.168.0.65 ansible_user=root

[edge]
ct101 ansible_host=192.168.0.101 ansible_user=root  # Traefik

[media]
ct102 ansible_host=192.168.0.176 ansible_user=root  # inpx-web
ct119 ansible_host=192.168.0.199 ansible_user=root  # Plex
ct120 ansible_host=192.168.0.205 ansible_user=root  # Tautulli

[utility]
ct106 ansible_host=192.168.0.106 ansible_user=root  # AdGuard Home, Syncthing, Homarr, Gitea

[photo]
ct107 ansible_host=192.168.0.233 ansible_user=root  # Immich

[lab]
ct108 ansible_host=192.168.0.99 ansible_user=root   # experiments

[ai]
# AI-стек на LXC выведен 2026-09: ct109 (OpenHands), ct111 (Hermes), ct112 (Ollama),
# ct114 (LibreChat), ct118 (LiteLLM) больше не существуют.
# Ollama теперь на omarchy-станции (192.168.0.16): systemd-сервис, glm-5.2:cloud.
# omarchy — Arch-станция, не Proxmox; ansible_user=viktot14, become=yes для root
omarchy ansible_host=192.168.0.16 ansible_user=viktot14

[databases]
ct110 ansible_host=192.168.0.9   ansible_user=root  # PostgreSQL 16

[monitoring]
ct115 ansible_host=192.168.0.247 ansible_user=root  # Uptime Kuma

[productivity]
ct113 ansible_host=192.168.0.77  ansible_user=root  # Dawarich
ct116 ansible_host=192.168.0.127 ansible_user=root  # Stirling-PDF
ct117 ansible_host=192.168.0.137 ansible_user=root  # Paperless-ngx
ct121 ansible_host=192.168.0.7   ansible_user=root  # Monica

[rvs]
ct122 ansible_host=192.168.0.122 ansible_user=root

